<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Defender — 2D Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
    }
    h1 {
      font-size: 1.6rem;
      color: #7af;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 0 12px #7af;
    }
    #gameCanvas {
      border: 2px solid #7af;
      box-shadow: 0 0 30px #7af4, 0 0 60px #7af2;
      display: block;
    }
    #ui {
      display: flex;
      justify-content: space-between;
      width: 600px;
      padding: 6px 4px;
      font-size: 0.85rem;
      color: #adf;
    }
    #controls {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #667;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1>Space Defender</h1>
  <div id="ui">
    <span>SCORE: <b id="scoreEl">0</b></span>
    <span>LEVEL: <b id="levelEl">1</b></span>
    <span>LIVES: <b id="livesEl">❤️❤️❤️</b></span>
  </div>
  <canvas id="gameCanvas" width="600" height="500"></canvas>
  <div id="controls">← → MOVE &nbsp;|&nbsp; SPACE SHOOT &nbsp;|&nbsp; ENTER RESTART</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');

    const W = canvas.width, H = canvas.height;

    // ── State ──────────────────────────────────────────────────────────
    let state, player, bullets, enemies, particles, stars;
    let score, lives, level, spawnTimer, spawnInterval, shootCooldown;
    let keys = {};

    // ── Stars (background) ────────────────────────────────────────────
    function initStars() {
      stars = Array.from({ length: 80 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.4 + 0.1,
        alpha: Math.random() * 0.6 + 0.3,
      }));
    }

    function updateStars() {
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      }
    }

    function drawStars() {
      for (const s of stars) {
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ── Init ───────────────────────────────────────────────────────────
    function init() {
      state = 'playing';
      score = 0;
      lives = 3;
      level = 1;
      spawnTimer = 0;
      spawnInterval = 90;
      shootCooldown = 0;
      player = { x: W / 2, y: H - 50, w: 36, h: 36, speed: 4, invincible: 0 };
      bullets = [];
      enemies = [];
      particles = [];
      initStars();
      updateUI();
    }

    function updateUI() {
      scoreEl.textContent = score;
      levelEl.textContent = level;
      livesEl.textContent = '❤️'.repeat(lives);
    }

    // ── Spawn enemies ─────────────────────────────────────────────────
    function spawnEnemy() {
      const types = [
        { w: 30, h: 30, speed: 1.2 + level * 0.15, hp: 1, color: '#f55', shape: 'ufo' },
        { w: 24, h: 24, speed: 1.8 + level * 0.2,  hp: 1, color: '#fa5', shape: 'dart' },
        { w: 38, h: 38, speed: 0.8 + level * 0.1,  hp: 3, color: '#a5f', shape: 'tank' },
      ];
      const t = types[Math.floor(Math.random() * (level < 3 ? 2 : 3))];
      enemies.push({
        x: Math.random() * (W - t.w) + t.w / 2,
        y: -t.h,
        vx: (Math.random() - 0.5) * 1.2,
        vy: t.speed,
        w: t.w, h: t.h,
        hp: t.hp, maxHp: t.hp,
        color: t.color,
        shape: t.shape,
        angle: 0,
      });
    }

    // ── Particles ─────────────────────────────────────────────────────
    function burst(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: Math.random() * 3 + 1,
          alpha: 1,
          color,
        });
      }
    }

    // ── Draw helpers ───────────────────────────────────────────────────
    function drawPlayer(p) {
      if (p.invincible > 0 && Math.floor(p.invincible / 6) % 2 === 0) return;
      ctx.save();
      ctx.translate(p.x, p.y);

      // Thruster flame
      const flicker = 0.7 + Math.random() * 0.3;
      const grad = ctx.createLinearGradient(0, 10, 0, 28 * flicker);
      grad.addColorStop(0, '#ff8800cc');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-8, 10);
      ctx.lineTo(0, 28 * flicker);
      ctx.lineTo(8, 10);
      ctx.closePath();
      ctx.fill();

      // Ship body
      ctx.fillStyle = '#5af';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(14, 12);
      ctx.lineTo(6, 8);
      ctx.lineTo(-6, 8);
      ctx.lineTo(-14, 12);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = '#cef';
      ctx.beginPath();
      ctx.ellipse(0, -4, 6, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wings accent
      ctx.strokeStyle = '#7cf';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-14, 12); ctx.lineTo(-6, 0);
      ctx.moveTo(14, 12);  ctx.lineTo(6, 0);
      ctx.stroke();

      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      e.angle += 0.02;

      if (e.shape === 'ufo') {
        // UFO saucer
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.ellipse(0, 4, e.w / 2, e.h / 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = e.color + 'aa';
        ctx.beginPath();
        ctx.ellipse(0, 0, e.w / 3, e.h / 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Lights
        for (let i = 0; i < 4; i++) {
          const a = e.angle + (i / 4) * Math.PI * 2;
          ctx.fillStyle = i % 2 === 0 ? '#ff0' : '#0ff';
          ctx.beginPath();
          ctx.arc(Math.cos(a) * (e.w / 2 - 4), 4 + Math.sin(a) * 3, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (e.shape === 'dart') {
        // Fast dart ship
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(0, e.h / 2);
        ctx.lineTo(e.w / 2, -e.h / 2);
        ctx.lineTo(0, -e.h / 4);
        ctx.lineTo(-e.w / 2, -e.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff5';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        // Tank
        ctx.fillStyle = e.color;
        ctx.fillRect(-e.w / 2, -e.h / 2, e.w, e.h);
        ctx.fillStyle = e.color + '88';
        ctx.fillRect(-e.w / 2 + 4, -e.h / 2 + 4, e.w - 8, e.h - 8);
        // HP bar
        ctx.fillStyle = '#300';
        ctx.fillRect(-e.w / 2, e.h / 2 + 3, e.w, 4);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(-e.w / 2, e.h / 2 + 3, e.w * (e.hp / e.maxHp), 4);
      }
      ctx.restore();
    }

    function drawBullet(b) {
      ctx.save();
      const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y - 14);
      grad.addColorStop(0, '#ff0');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(b.x - 2, b.y - 14, 4, 14);
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ── Collision ──────────────────────────────────────────────────────
    function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
      return Math.abs(ax - bx) < (aw + bw) / 2 &&
             Math.abs(ay - by) < (ah + bh) / 2;
    }

    // ── Update ─────────────────────────────────────────────────────────
    function update() {
      if (state !== 'playing') return;

      updateStars();

      // Player movement
      if (keys['ArrowLeft']  && player.x - player.w / 2 > 0)      player.x -= player.speed;
      if (keys['ArrowRight'] && player.x + player.w / 2 < W)      player.x += player.speed;
      if (keys['ArrowUp']    && player.y - player.h / 2 > H * 0.4) player.y -= player.speed;
      if (keys['ArrowDown']  && player.y + player.h / 2 < H)       player.y += player.speed;

      // Shoot
      if (keys[' '] && shootCooldown <= 0) {
        bullets.push({ x: player.x, y: player.y - 20, vy: -9 });
        shootCooldown = 14;
      }
      if (shootCooldown > 0) shootCooldown--;
      if (player.invincible > 0) player.invincible--;

      // Bullets
      bullets = bullets.filter(b => b.y > -10);
      for (const b of bullets) b.y += b.vy;

      // Spawn enemies
      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnEnemy();
        if (spawnInterval > 30) spawnInterval -= 0.5;
      }

      // Level up every 500 points
      const newLevel = Math.floor(score / 500) + 1;
      if (newLevel !== level) { level = newLevel; updateUI(); }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;
        if (e.x < e.w / 2 || e.x > W - e.w / 2) e.vx *= -1;

        // Off screen
        if (e.y > H + e.h) { enemies.splice(i, 1); continue; }

        // Bullet hits
        let hit = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (rectHit(e.x, e.y, e.w, e.h, b.x, b.y, 4, 14)) {
            bullets.splice(j, 1);
            e.hp--;
            burst(b.x, b.y, '#ff0', 6);
            if (e.hp <= 0) {
              burst(e.x, e.y, e.color, 18);
              const pts = e.shape === 'tank' ? 30 : e.shape === 'dart' ? 20 : 10;
              score += pts;
              updateUI();
              enemies.splice(i, 1);
              hit = true;
            }
            break;
          }
        }
        if (hit) continue;

        // Enemy hits player
        if (player.invincible <= 0 && rectHit(e.x, e.y, e.w, e.h, player.x, player.y, player.w, player.h)) {
          burst(player.x, player.y, '#f55', 20);
          burst(e.x, e.y, e.color, 12);
          enemies.splice(i, 1);
          lives--;
          player.invincible = 90;
          updateUI();
          if (lives <= 0) { state = 'gameover'; }
        }
      }

      // Particles
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.05;
        p.r  *= 0.96;
        p.alpha -= 0.03;
      }
      particles = particles.filter(p => p.alpha > 0);
    }

    // ── Draw ───────────────────────────────────────────────────────────
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Background
      ctx.fillStyle = '#06060f';
      ctx.fillRect(0, 0, W, H);

      drawStars();

      for (const e of enemies) drawEnemy(e);
      for (const b of bullets) drawBullet(b);
      drawPlayer(player);
      drawParticles();

      if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f55';
        ctx.font = 'bold 52px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
        ctx.fillStyle = '#adf';
        ctx.font = '22px Courier New';
        ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 18);
        ctx.fillStyle = '#7af';
        ctx.font = '16px Courier New';
        ctx.fillText('Press ENTER to restart', W / 2, H / 2 + 54);
        ctx.textAlign = 'left';
      }
    }

    // ── Loop ───────────────────────────────────────────────────────────
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // ── Input ──────────────────────────────────────────────────────────
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === 'Enter' && state === 'gameover') init();
      if ([' ', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // ── Start ──────────────────────────────────────────────────────────
    init();
    loop();
  </script>
</body>
</html>
